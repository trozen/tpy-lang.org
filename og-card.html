<!doctype html>
<!-- Source of docs/og.png, the social-share preview card. Rendered by `make og`
     with headless Chrome at exactly 1200x630; colors and the TPy mark mirror
     index.html so the card looks like the page it links to. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0c0f17;
    --line:#222a3a;
    --text:#e7ecf5;
    --muted:#9aa6bd;
    --faint:#6f7d99;
    --accent:#ff8a3d;
    --accent2:#ffd23d;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 80% at 75% 0%,rgba(255,138,61,.20),transparent 60%),
               radial-gradient(50% 70% at 15% 15%,rgba(90,169,255,.14),transparent 60%);
  }
  .card{position:relative;padding:76px 84px;height:100%;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:22px;font-weight:700;font-size:44px;letter-spacing:-.02em}
  .mark{
    height:64px;min-width:64px;padding:0 18px;border-radius:16px;letter-spacing:-.03em;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#1a1206;font-weight:800;font-size:31px;
    box-shadow:0 0 40px rgba(255,138,61,.4);
  }
  h1{margin:64px 0 0;font-size:66px;line-height:1.1;letter-spacing:-.025em;font-weight:700;max-width:16em}
  .lede{margin:26px 0 0;font-size:31px;line-height:1.4;color:var(--muted);letter-spacing:-.005em;max-width:30em}
  .lede b{color:var(--text);font-weight:600;white-space:nowrap}
  .foot{margin-top:auto;display:flex;align-items:center;gap:28px;padding-top:34px;border-top:1px solid var(--line);
    font-size:24px;color:var(--faint)}
  .foot code{font-family:var(--mono);font-size:24px;color:var(--accent2);background:rgba(255,210,61,.08);
    padding:6px 16px;border-radius:9px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="mark">TPy</span> TurboPython</div>
  <h1>A Python-to-C++ compiler</h1>
  <p class="lede">Typed Python compiled to native binaries: <b>no Python runtime</b>, <b>no garbage collector</b>, <b>no GIL</b>. Source files stay valid Python.</p>
  <div class="foot"><code>pip install tpy-lang</code><span>tpy-lang.org</span></div>
</div>
</body>
</html>
